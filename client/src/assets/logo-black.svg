<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grunge signature logo for Landon & Co (Black version) -->
  <defs>
    <filter id="roughPaperBlack" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.04" numOctaves="3" result="noise" seed="1"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <filter id="glowBlack">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main signature text with handwritten style -->
  <g filter="url(#roughPaperBlack)">
    <!-- Landon in bold script style -->
    <text x="20" y="35" font-family="Brush Script MT, Impact, serif" font-size="32" font-weight="bold" fill="black" 
          text-shadow="1px 1px 2px rgba(255,255,255,0.3)" filter="url(#glowBlack)">
      Landon
    </text>
    
    <!-- & symbol in elegant script -->
    <text x="130" y="35" font-family="Georgia, serif" font-size="24" font-style="italic" fill="black" 
          text-shadow="1px 1px 2px rgba(255,255,255,0.3)">
      &amp;
    </text>
    
    <!-- Co. completing the signature -->
    <text x="160" y="35" font-family="Brush Script MT, Impact, serif" font-size="32" font-weight="bold" fill="black" 
          text-shadow="1px 1px 2px rgba(255,255,255,0.3)" filter="url(#glowBlack)">
      Co.
    </text>
  </g>
  
  <!-- Grunge underline stroke -->
  <path d="M 20 45 Q 80 43 140 45 T 220 45" stroke="black" stroke-width="2" opacity="0.7" 
        stroke-linecap="round" fill="none" filter="url(#roughPaperBlack)"/>
  
  <!-- Tagline in clean modern font -->
  <text x="20" y="62" font-family="JetBrains Mono, monospace" font-size="10" font-weight="400" 
        fill="black" opacity="0.85" letter-spacing="1px">
    WEB DESIGN • BRANDING • DIGITAL EXPERIENCES
  </text>
</svg>