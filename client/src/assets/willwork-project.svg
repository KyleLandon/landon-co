<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional construction website mockup -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Header bar -->
  <rect x="0" y="0" width="400" height="60" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Logo area -->
  <rect x="20" y="15" width="120" height="30" fill="#1e3a8a" rx="4"/>
  <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">WILL WORK</text>
  
  <!-- Navigation -->
  <text x="160" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">HOME</text>
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">SERVICES</text>
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">PROJECTS</text>
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">CONTACT</text>
  
  <!-- Hero section -->
  <rect x="0" y="60" width="400" height="120" fill="#1e3a8a"/>
  <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Professional Construction</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Quality Building Services</text>
  
  <!-- Content cards -->
  <rect x="30" y="200" width="100" height="80" fill="white" rx="8" opacity="0.9"/>
  <rect x="150" y="200" width="100" height="80" fill="white" rx="8" opacity="0.9"/>
  <rect x="270" y="200" width="100" height="80" fill="white" rx="8" opacity="0.9"/>
  
  <!-- Card icons and text -->
  <circle cx="80" cy="225" r="15" fill="#1e3a8a"/>
  <circle cx="200" cy="225" r="15" fill="#1e3a8a"/>
  <circle cx="320" cy="225" r="15" fill="#1e3a8a"/>
  
  <text x="80" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Residential</text>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Commercial</text>
  <text x="320" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">Renovation</text>
</svg>