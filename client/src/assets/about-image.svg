<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional developer portrait -->
  <defs>
    <linearGradient id="profileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#profileBg)"/>
  
  <!-- Code pattern background -->
  <g opacity="0.1">
    <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="10" fill="white">const developer = {</text>
    <text x="40" y="50" font-family="JetBrains Mono, monospace" font-size="10" fill="white">name: 'Kyle Landon',</text>
    <text x="40" y="70" font-family="JetBrains Mono, monospace" font-size="10" fill="white">skills: ['React', 'Node.js'],</text>
    <text x="40" y="90" font-family="JetBrains Mono, monospace" font-size="10" fill="white">passion: 'Web Development'</text>
    <text x="20" y="110" font-family="JetBrains Mono, monospace" font-size="10" fill="white">};</text>
  </g>
  
  <!-- Profile silhouette -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="50" fill="#4338ca" filter="url(#glow)"/>
    
    <!-- Body -->
    <rect x="-40" y="20" width="80" height="100" fill="#4338ca" rx="20" filter="url(#glow)"/>
    
    <!-- Arms -->
    <rect x="-60" y="30" width="20" height="60" fill="#4338ca" rx="10" filter="url(#glow)"/>
    <rect x="40" y="30" width="20" height="60" fill="#4338ca" rx="10" filter="url(#glow)"/>
    
    <!-- Laptop representation -->
    <rect x="-25" y="40" width="50" height="30" fill="#1e293b" rx="2"/>
    <rect x="-20" y="45" width="40" height="20" fill="#0ea5e9" rx="1"/>
    <g opacity="0.8">
      <text x="0" y="55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="white">&lt;/&gt;</text>
    </g>
  </g>
  
  <!-- Name and title -->
  <text x="200" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="bold" fill="white">Kyle Landon</text>
  <text x="200" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#64748b">Web Developer & Designer</text>
  <text x="200" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748b">Landon & Co.</text>
  
  <!-- Tech icons -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="20" height="15" fill="#61dafb" rx="2"/>
    <text x="10" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="black">JS</text>
    
    <rect x="30" y="0" width="20" height="15" fill="#38bdf8" rx="2"/>
    <text x="40" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">TS</text>
    
    <rect x="60" y="0" width="20" height="15" fill="#059669" rx="2"/>
    <text x="70" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">NODE</text>
    
    <rect x="90" y="0" width="20" height="15" fill="#8b5cf6" rx="2"/>
    <text x="100" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">CSS</text>
    
    <rect x="120" y="0" width="20" height="15" fill="#f59e0b" rx="2"/>
    <text x="130" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="black">AWS</text>
  </g>
</svg>