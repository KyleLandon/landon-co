<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Comic mystery boxes e-commerce site mockup -->
  <defs>
    <linearGradient id="comicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <pattern id="comicDots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background with comic book style -->
  <rect width="400" height="300" fill="url(#comicBg)"/>
  <rect width="400" height="300" fill="url(#comicDots)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.8)"/>
  <text x="20" y="32" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">COMIC MYSTERIES</text>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="12" fill="white">SHOP • BOXES • ABOUT</text>
  
  <!-- Hero title with comic book style -->
  <text x="200" y="90" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="bold" fill="white" stroke="#000" stroke-width="1">MYSTERY BOXES</text>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fbbf24">Curated Comic Collections</text>
  
  <!-- Mystery boxes representation -->
  <g transform="translate(50, 140)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="80" height="80" fill="#374151" stroke="#fbbf24" stroke-width="2" rx="4"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">STARTER</text>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">?</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">$19.99</text>
    
    <!-- Box 2 -->
    <rect x="110" y="0" width="80" height="80" fill="#374151" stroke="#fbbf24" stroke-width="2" rx="4"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">PREMIUM</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">?</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">$39.99</text>
    
    <!-- Box 3 -->
    <rect x="220" y="0" width="80" height="80" fill="#374151" stroke="#fbbf24" stroke-width="2" rx="4"/>
    <text x="260" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">ULTIMATE</text>
    <text x="260" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">?</text>
    <text x="260" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">$69.99</text>
  </g>
  
  <!-- Action button -->
  <rect x="150" y="250" width="100" height="30" fill="#fbbf24" rx="4"/>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000">ORDER NOW</text>
</svg>